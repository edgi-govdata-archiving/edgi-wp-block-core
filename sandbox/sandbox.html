<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDP Emissions Map Block</title>

    <!-- Load compiled block styles -->
    <link rel="stylesheet" href="../build/cdp-emissions-map/style-index.css">

    <style>
        body {
            background: #f7fafc;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .sandbox-container {
            width: 100%;
            max-width: 1200px;
        }
    </style>
</head>
<body>

    <div class="sandbox-container">
        <!-- Match structural output generated by php render_callback -->
        <div id="cdp-emissions-map"
             data-states-json-url="../assets/maps/states.topojson"
             data-counties-json-url="../assets/maps/us-counties.json"
             data-states-ghg-json-url="../assets/data/ghg_state.topojson"
             data-counties-ghg-url="../assets/data/ghg_county.topojson"
             data-facilities-test="../assets/data/facilities/ghg_facilities_2010.geojson"
             data-facilities-name="../assets/data/facilities/ghg_facilities_"
             data-facilities-file-type="geojson"
             facilities-start-year="2016"
             facilities-end-year="2023"
             back-icon-url="../assets/icons/back-icon.svg"
             close-icon-url="../assets/icons/close-icon.svg">

            <div class="dashboard">
                <div class="map-wrapper">
                    <div class="map-group">
                        <div class="map"></div>
                        <div class="back-button-wrapper"></div>
                        <div class="legend-wrapper"></div>
                    </div>
                    
                </div>
                <div class="message-wrapper"></div>
            </div>
        </div>
    </div>

    <!-- Load compiled block view script -->
    <script src="../build/cdp-emissions-map/view.js"></script>
</body>
</html>
