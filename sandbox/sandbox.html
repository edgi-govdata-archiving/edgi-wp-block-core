<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDP Emissions Map Block</title>

    <!-- Load compiled block styles -->
    <link rel="stylesheet" href="../build/cdp-emissions-map/style-index.css">

    <style>
        body {
            background: #f7fafc;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .sandbox-header {
            margin-bottom: 30px;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #2d3748;
        }

            .sandbox-header h1 {
                margin: 0 0 10px 0;
                font-size: 28px;
                color: #1a202c;
            }

            .sandbox-header p {
                margin: 0;
                color: #718096;
                font-size: 14px;
            }

        .sandbox-container {
            width: 100%;
            max-width: 1200px;
        }
    </style>
</head>
<body>

    <div class="sandbox-container">
        <!-- Match structural output generated by php render_callback -->
        <div class="edgi-visualization-dashboard"
             data-csv-url="../assets/report-metadata.csv"
             data-states-json-url="../assets/maps/us-states.json"
             data-counties-json-url="../assets/maps/us-counties.json"
             data-states-ghg-json-url="./data/ghg_state.topojson"
             data-counties-ghg-url="./data/ghg_county.topojson"
             data-districts-json-url="../assets/maps/cb_2025_us_cd119_5m.json">
            <div class="edgi-map-container">
                <div class="edgi-map-header">
                    <h3 class="edgi-map-title">US Emissions</h3>
                </div>

                <div class="edgi-map-layout">
                    <div class="edgi-map-canvas-wrapper">
                        <div class="edgi-map-controls">
                            <button class="edgi-btn edgi-btn-reset" style="display: none;">&#8592</button>
                        </div>
                        <div class="edgi-map-canvas"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load compiled block view script -->
    <script src="../build/cdp-emissions-map/view.js"></script>
</body>
</html>
