<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDP Emissions Map Block</title>

    <!-- Load compiled block styles -->
    <link rel="stylesheet" href="../build/cdp-emissions-map/style-index.css">

    <style>
        body {
            background: #f7fafc;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .sandbox-container {
            width: 100%;
            max-width: 1400px;
        }
    </style>
</head>
<body>

    <div class="sandbox-container">
        <!-- Match structural output generated by php render_callback -->
        <div id="cdp-emissions-map"
             data-csv-url="../assets/report-metadata.csv"
             data-states-json-url="../assets/maps/us-states.json"
             data-counties-json-url="../assets/maps/us-counties.json"
             data-states-ghg-json-url="./data/ghg_state.topojson"
             data-counties-ghg-url="./data/ghg_county.topojson"
             data-facilities-name="./data/facilities/ghg_facilities_"
             data-facilities-file-type="geojson"
             facilities-start-year="2016"
             facilities-end-year="2023">

            <div class="dashboard">
                <div class="map-wrapper">
                    <div class="back-button-wrapper"></div>
                    <div class="legend-wrapper"></div>
                    <div class="map"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load compiled block view script -->
    <script src="../build/cdp-emissions-map/view.js"></script>
</body>
</html>
